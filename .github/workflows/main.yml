name: Radar Bandi Reali - Daily 06:47
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4 lxml
      - run: python scripts/fetch_real.py
      - run: |
          git config user.name "radar-bot"
          git config user.email "bot@radar.local"
          git add public/gare.json
          git diff --staged --quiet || git commit -m "auto: bandi reali TED $(date -u +%F)"
          git push
