                      j=r.json()
                      for n in j.get("notices", []):
                          ti=n.get("TI",{})
                          titolo = ti.get("it") if isinstance(ti, dict) else str(ti) if ti else ""
                          titolo_l = titolo.lower()
                          # filtro largo: se contiene una keyword BIP o cpv affine -> tieni
                          match = any(k in titolo_l for k in [k.lower() for k in KEYWORDS]) or any(c in str(n) for c in CPV_BIP)
                          # per settembre/ottobre teniamo anche senza match esatto, poi score più basso
                          score = 90 if match else 72
                          if len(gare)<40:
                              gare.append({
                                "id": str(n.get("ND") or n.get("id") or len(gare)),
                                "ente": (n.get("AU") or n.get("AA") or "PA Italiana")[:80],
                                "oggetto": titolo or f"Servizi consulenza - {n.get('ND')}",
                                "importo": n.get("NC") or n.get("TV") or "Sopra soglia",
                                "scadenza": (n.get("DS") or (datetime.now()+timedelta(days=20)).isoformat()),
                                "cpv": str(n.get("CPV") or "79411000-8"),
                                "fonte": "TED LIVE VERO - 23/09/2026",
                                "url": f"https://ted.europa.eu/udl?uri=TED:NOTICE:{n.get('ND')}:TEXT:IT:HTML",
                                "score": score,
                                "tipo": "Aperta"
                              })
                      if len(gare)>=15: break
              except Exception as e:
                  print(f"err {e}")
          # Filtro finale per team: tieni solo score >=70 e ordina per score
          gare_sorted = sorted(gare, key=lambda x: x['score'], reverse=True)[:25]
