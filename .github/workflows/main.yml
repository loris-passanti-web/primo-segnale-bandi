name: Radar Bandi - Daily LIVE
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create fetcher LARGO BIP
        run: |
          mkdir -p public
          cat > fetch.py << 'PY'
