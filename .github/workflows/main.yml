          # 1) Prova 3 ricerche TED diverse per prendere più bandi
          queries = [
            "country:IT AND (FT=794 OR FT=805)",
            "country:IT AND FT=722",
            "country:IT"
          ]
          for q in queries:
              try:
                  url = f"https://ted.europa.eu/api/v3.0/notices/search?limit=100&q={q}&sort=PD desc"
